<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>🏠 Sohin's Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:            #0D0D0D;
      --bg2:           #141414;
      --card:          #1A1A1A;
      --card2:         #202020;
      --primary:       #E8E8E8;
      --primary-light: #2A2A2A;
      --primary-dim:   #3C3C3C;
      --green:         #74C69D;
      --green-light:   rgba(116,198,157,0.13);
      --red:           #E07070;
      --red-light:     rgba(224,112,112,0.13);
      --yellow:        #F0A849;
      --yellow-light:  rgba(240,168,73,0.13);
      --blue:          #64B5F6;
      --blue-light:    rgba(100,181,246,0.13);
      --text:          #ECECEC;
      --text-muted:    #888;
      --text-dim:      #555;
      --border:        #2C2C2C;
      --border2:       #383838;
      --nav-h:         68px;
      --radius-lg:     18px;
      --radius-md:     12px;
      --radius-sm:     8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding-bottom: calc(var(--nav-h) + 20px);
      -webkit-font-smoothing: antialiased;
    }

    /* ══ Header ══ */
    .app-header {
      background: var(--card); padding: 14px 18px 12px;
      position: sticky; top: 0; z-index: 40;
      border-bottom: 1px solid var(--border);
    }
    .app-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--text); }
    .header-sub { font-size: 0.66rem; color: var(--text-dim); margin-top: 1px; letter-spacing: 0.05em; text-transform: uppercase; }
    .member-chip {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: 50px; padding: 6px 12px 6px 7px;
      font-size: 0.8rem; font-weight: 800; cursor: pointer; color: var(--text); transition: all 0.2s;
    }
    .member-chip:hover { background: var(--primary-light); border-color: var(--primary-dim); }
    .m-avatar {
      width: 26px; height: 26px; background: var(--primary); color: var(--bg);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 900;
    }

    /* ══ Bottom Nav ══ */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h);
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; z-index: 40;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; cursor: pointer; color: var(--text-dim); font-size: 0.65rem; font-weight: 800;
      letter-spacing: 0.04em; border: none; background: none; transition: color 0.2s;
    }
    .nav-btn i { font-size: 1.3rem; transition: transform 0.2s; }
    .nav-btn.active { color: var(--primary); }
    .nav-btn.active i { transform: scale(1.1); }

    /* ══ Tabs ══ */
    .tab-pane { display: none; padding: 14px 14px 6px; animation: fadeUp 0.28s ease; }
    .tab-pane.active { display: block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }

    .section-title {
      font-family: 'Playfair Display', serif; font-size: 0.98rem;
      color: var(--text); margin-bottom: 10px;
      display: flex; align-items: center; gap: 9px;
    }
    .section-title::after { content:''; flex:1; height:1px; background: var(--border); }
    .container { max-width: 500px; margin: 0 auto; }

    /* ══ Cards ══ */
    .card {
      background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--border);
      padding: 12px 14px; margin-bottom: 8px; position: relative; transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border2); }

    /* ══ Color Filter Bar ══ */
    .color-filter-bar { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
    .color-filter-bar::-webkit-scrollbar { display: none; }
    .cf-btn {
      display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 50px;
      border: 1px solid var(--border2); background: var(--card2); color: var(--text-muted);
      font-size: 0.76rem; font-weight: 800; cursor: pointer; white-space: nowrap;
      transition: all 0.18s; flex-shrink: 0;
    }
    .cf-btn:hover { border-color: var(--primary-dim); color: var(--text); }
    .cf-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .cf-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    /* ══ Inventory Row ══ */
    .inv-row { display: flex; align-items: center; gap: 8px; }
    .inv-info { flex: 1; min-width: 0; }
    .inv-name { font-weight: 800; font-size: 0.93rem; display: flex; align-items: center; gap: 7px; line-height: 1.3; flex-wrap: wrap; }
    .color-dot {
      width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--card); position: relative; z-index: 1;
    }
    .inv-meta { font-size: 0.71rem; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .inv-memo {
      display: flex; align-items: center; gap: 5px; margin-top: 6px; padding: 5px 10px;
      background: rgba(240,168,73,0.08); border: 1px solid rgba(240,168,73,0.2);
      border-radius: 8px; font-size: 0.72rem; color: var(--yellow); font-weight: 700;
    }

    /* ══ Sort Buttons ══ */
    .sort-controls { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
    .sort-btn {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); cursor: pointer; font-size: 0.72rem; transition: all 0.15s; padding: 0;
    }
    .sort-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary); border-color: var(--border2); }
    .sort-btn:disabled { opacity: 0.18; cursor: not-allowed; pointer-events: none; }

    /* ══ Qty ══ */
    .qty-box {
      display: flex; align-items: center; gap: 5px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 50px; padding: 3px 8px; flex-shrink: 0;
    }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer;
      font-size: 1rem; font-weight: 900; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0; line-height: 1;
    }
    .qty-btn.minus { background: var(--primary-light); color: var(--text); }
    .qty-btn.minus:hover { background: var(--red-light); color: var(--red); }
    .qty-val { font-weight: 900; font-size: 0.98rem; min-width: 22px; text-align: center; color: var(--text); }
    .qty-btn.plus { background: var(--green-light); color: var(--green); }
    .qty-btn.plus:hover { background: var(--green); color: var(--bg); }

    /* ══ Status ══ */
    .status-btn {
      padding: 5px 11px; border-radius: 50px; font-size: 0.76rem; font-weight: 800;
      cursor: pointer; border: 1px solid transparent; user-select: none; white-space: nowrap;
      flex-shrink: 0; transition: all 0.18s;
    }
    .status-btn.ok   { background: var(--green-light);  color: var(--green);  border-color: rgba(116,198,157,0.25); }
    .status-btn.warn { background: var(--yellow-light); color: var(--yellow); border-color: rgba(240,168,73,0.25); }
    .status-btn.bad  { background: var(--red-light);    color: var(--red);    border-color: rgba(224,112,112,0.25); }

    /* ══ Icon Buttons ══ */
    .action-btn-group { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      width: 30px; height: 30px; border-radius: var(--radius-sm); border: none; cursor: pointer;
      font-size: 0.8rem; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .del-btn  { background: var(--red-light);  color: var(--red);  } .del-btn:hover  { background: var(--red);  color: #fff; }
    .edit-btn { background: var(--blue-light); color: var(--blue); } .edit-btn:hover { background: var(--blue); color: var(--bg); }

    /* ══ Shopping List ══ */
    .shop-row { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .shop-row:last-child { border-bottom: none; }
    .shop-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ══ Chores ══ */
    .chore-row { display: flex; align-items: flex-start; gap: 12px; }
    .chore-check {
      width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border2);
      cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; margin-top: 1px; font-size: 0.78rem; font-weight: 900; color: var(--bg); background: var(--bg2);
    }
    .chore-check.done { background: var(--green); border-color: var(--green); }
    .chore-title { font-weight: 800; font-size: 0.92rem; flex: 1; transition: all 0.2s; }
    .chore-title.done { text-decoration: line-through; color: var(--text-dim); }
    .chore-sub { font-size: 0.71rem; color: var(--text-muted); margin-top: 2px; }
    .chore-chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px;
      border-radius: 50px; border: 1px solid var(--border); background: var(--bg2);
      color: var(--text); font-size: 0.79rem; font-weight: 800; cursor: pointer; transition: all 0.15s; margin-bottom: 6px;
    }
    .chore-chip.selected { border-color: var(--green); background: var(--green-light); color: var(--green); }

    /* ══ FAB ══ */
    .fab {
      position: fixed; bottom: calc(var(--nav-h) + 14px); right: 18px;
      width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: var(--bg);
      border: none; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 35; transition: all 0.2s;
    }
    .fab:hover { transform: scale(1.08); background: #fff; }
    .fab:active { transform: scale(0.94) !important; }

    /* ══ Modal ══ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(5px); z-index: 50; display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--card); border-radius: 24px 24px 0 0; padding: 18px 18px 44px;
      width: 100%; max-width: 500px; animation: slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1);
      max-height: 93vh; overflow-y: auto; border-top: 1px solid var(--border2);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 99px; margin: 0 auto 16px; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 16px; color: var(--text); }

    /* ══ Forms ══ */
    .field-label {
      font-size: 0.7rem; font-weight: 900; color: var(--text-muted); margin-bottom: 6px;
      letter-spacing: 0.07em; text-transform: uppercase; margin-top: 14px;
    }
    .field-input {
      width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--radius-md);
      font-family: 'Nunito', sans-serif; font-size: 0.93rem; font-weight: 700; color: var(--text);
      background: var(--bg2); outline: none; transition: border-color 0.2s, background 0.2s;
    }
    .field-input:focus { border-color: var(--border2); background: var(--bg); }

    .color-picker { display: flex; gap: 10px; padding: 8px 4px 12px; overflow-x: auto; scrollbar-width: none; }
    .color-picker::-webkit-scrollbar { display: none; }
    .color-option {
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; flex-shrink: 0; transition: transform 0.18s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    .color-option.selected { transform: scale(1.22); box-shadow: 0 0 0 3px var(--card), 0 0 0 5px white; }

    .toggle-group { display: flex; gap: 7px; flex-wrap: wrap; }
    .toggle-btn {
      flex: 1; min-width: 88px; padding: 10px 6px; border-radius: var(--radius-md);
      border: 1px solid var(--border); background: var(--bg2); color: var(--text);
      font-family: 'Nunito', sans-serif; font-size: 0.79rem; font-weight: 800; cursor: pointer; transition: all 0.18s; text-align: center;
    }
    .toggle-btn.selected { border-color: var(--border2); background: var(--primary-light); color: var(--primary); }

    .btn-primary {
      width: 100%; padding: 13px; background: var(--primary); color: var(--bg); border: none;
      border-radius: var(--radius-md); font-family: 'Nunito', sans-serif; font-size: 0.95rem;
      font-weight: 900; cursor: pointer; margin-top: 16px; transition: all 0.2s;
    }
    .btn-primary:hover { background: #fff; }
    .btn-cancel { width: 100%; margin-top: 8px; padding: 11px; background: none; border: none; color: var(--text-muted); font-family: 'Nunito', sans-serif; font-size: 0.88rem; font-weight: 700; cursor: pointer; }

    /* ══ Alert badge ══ */
    .alert-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 0.64rem; font-weight: 900; padding: 2px 7px;
      background: var(--red-light); color: var(--red); border-radius: 50px; border: 1px solid rgba(224,112,112,0.2);
    }

    /* ══ Connection Banner ══ */
    #conn-banner {
      display: none; align-items: center; gap: 8px;
      background: rgba(240,168,73,0.1); border-bottom: 1px solid var(--border);
      color: var(--yellow); padding: 9px 16px; font-size: 0.79rem; font-weight: 700; line-height: 1.4;
    }

    /* ══ Firebase Status Dot ══ */
    .db-status {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.66rem; font-weight: 800; color: var(--text-dim);
    }
    .db-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
    .db-dot.online  { background: var(--green); box-shadow: 0 0 5px var(--green); }
    .db-dot.offline { background: var(--yellow); }
    .db-dot.error   { background: var(--red); }

    /* ══ Toast ══ */
    #toast {
      visibility: hidden; min-width: 200px; text-align: center; border-radius: var(--radius-md);
      padding: 11px 22px; position: fixed; z-index: 9999; left: 50%;
      bottom: calc(var(--nav-h) + 24px); transform: translateX(-50%);
      box-shadow: 0 4px 18px rgba(0,0,0,0.6); font-weight: 700; font-size: 0.88rem;
      border: 1px solid; transition: none;
    }
    #toast.show { visibility: visible; animation: toastIn 0.28s ease, toastOut 0.35s 2.4s ease forwards; }
    @keyframes toastIn  { from { opacity:0; bottom: calc(var(--nav-h) + 8px); } to { opacity:1; bottom: calc(var(--nav-h) + 24px); } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; } }

    /* ══ Welcome ══ */
    #welcome-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 60;
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 36px 28px; gap: 22px;
    }
    .welcome-title { font-family: 'Playfair Display', serif; font-size: 1.85rem; text-align: center; color: var(--text); line-height: 1.25; }

    /* ══ Loading overlay ══ */
    #loading-overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 55;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    .loading-spinner { width: 36px; height: 36px; border: 3px solid var(--border2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .date-badge {
      font-size: 0.74rem; font-weight: 800; color: var(--text-dim);
      border: 1px solid var(--border); padding: 4px 12px; border-radius: 50px;
      display: inline-block; margin-bottom: 12px;
    }
    .empty { text-align: center; padding: 28px 16px; color: var(--text-muted); font-size: 0.86rem; }
    .empty i { font-size: 2rem; margin-bottom: 10px; display: block; opacity: 0.4; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }
    button { transition: transform 0.12s ease, background-color 0.18s ease, opacity 0.18s ease !important; }
    button:active { transform: scale(0.93) !important; }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div style="color:var(--text-muted); font-size:0.83rem; font-weight:700;">連線中…</div>
</div>

<div id="toast"></div>

<div id="conn-banner">
  <i class="fa fa-triangle-exclamation"></i>
  <span>Firebase 連線失敗，目前顯示<strong>示範模式</strong>。資料不會永久保存。</span>
</div>

<!-- Welcome -->
<div id="welcome-screen">
  <div style="font-size:3.8rem; line-height:1;">🏠</div>
  <div>
    <div class="welcome-title">歡迎來到<br/>Sohin's Home</div>
    <p style="text-align:center; color:var(--text-muted); font-size:0.88rem; margin-top:8px; line-height:1.7;">
      全方位家庭管理中心<br/>請輸入你的名字，開始使用！
    </p>
  </div>
  <div style="width:100%; max-width:320px;">
    <div class="field-label" style="margin-top:0;">你叫什麼名字？</div>
    <input id="welcome-name-input" class="field-input" type="text" placeholder="例如：小明、爸爸、媽媽" maxlength="10"
      onkeydown="if(event.key==='Enter') submitWelcomeName()" />
    <button class="btn-primary" onclick="submitWelcomeName()">進入 🏡</button>
  </div>
</div>

<!-- App -->
<div id="app" style="display:none;">
  <header class="app-header">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between;">
      <div>
        <div class="app-title">🏠 Sohin's home</div>
        <div style="display:flex; align-items:center; gap:8px; margin-top:2px;">
          <div class="header-sub">HOME MANAGEMENT</div>
          <div class="db-status" id="db-status-indicator">
            <div class="db-dot" id="db-dot"></div>
            <span id="db-status-text">…</span>
          </div>
        </div>
      </div>
      <div class="member-chip" onclick="openMemberModal()">
        <div class="m-avatar" id="member-avatar">?</div>
        <span id="current-member-name">我</span>
        <i class="fa fa-chevron-down" style="font-size:0.55rem; color:var(--text-dim);"></i>
      </div>
    </div>
  </header>

  <div id="tab-dashboard" class="tab-pane active">
    <div class="container">
      <div style="margin-bottom:18px;">
        <div class="section-title"><i class="fa fa-cart-shopping" style="color:var(--primary); font-size:0.85rem;"></i> 待購清單</div>
        <div id="shopping-list"></div>
      </div>
      <div>
        <div class="section-title"><i class="fa fa-box-open" style="color:var(--primary); font-size:0.85rem;"></i> 家庭庫存</div>
        <div class="color-filter-bar" id="color-filter-bar">
          <button class="cf-btn active" data-color="all" onclick="setColorFilter('all', this)">
            <span style="font-size:0.8rem;">⬜</span> 全部
          </button>
        </div>
        <div id="inventory-list"><div class="empty"><i class="fa fa-spinner fa-spin"></i>載入中...</div></div>
      </div>
    </div>
  </div>

  <div id="tab-chores" class="tab-pane">
    <div class="container">
      <div class="date-badge" id="today-badge">📅</div>
      <div class="section-title"><i class="fa fa-broom" style="color:var(--primary); font-size:0.85rem;"></i> 今日家務</div>
      <div id="chores-list"></div>
      <div style="margin-top:22px;">
        <div class="section-title"><i class="fa fa-medal" style="color:var(--primary); font-size:0.85rem;"></i> 今日完成紀錄</div>
        <div id="recent-log"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-dashboard" onclick="switchTab('dashboard')">
      <i class="fa fa-house"></i><span>庫存</span>
    </button>
    <button class="nav-btn" id="nav-chores" onclick="switchTab('chores')">
      <i class="fa fa-broom"></i><span>家務</span>
    </button>
  </nav>
</div>

<button class="fab" id="fab-btn" style="display:none;" onclick="handleFab()"><i class="fa fa-plus"></i></button>

<!-- Modal: Add/Edit Item -->
<div class="modal-overlay" id="modal-add-item">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="item-modal-title">➕ 新增庫存物品</div>
    <input type="hidden" id="edit-item-id" />

    <div>
      <div class="field-label" style="margin-top:0;">物品名稱 *</div>

<!-- ════════════════ SCRIPT ════════════════ -->
<script type="module">
  import { initializeApp }       from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, enableIndexedDbPersistence,
           collection, doc, onSnapshot,
           addDoc, updateDoc, deleteDoc, query, orderBy }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  // ══ Config ══
  const firebaseConfig = {
    apiKey:            "AIzaSyDQ6lycJWKBnINu1Qbu8kTT_PGYP2rPzrs",
    authDomain:        "home-app-data.firebaseapp.com",
    projectId:         "home-app-data",
    storageBucket:     "home-app-data.firebasestorage.app",
    messagingSenderId: "116703485136",
    appId:             "1:116703485136:web:2a21ea6ac010ae685152d5",
  };

  // ══ State ══
  let db = null, isFirebaseOk = false;
  let currentMemberId = '', currentMemberName = '我';
  let members = [], inventoryItems = [], choresItems = [];
  let activeColorFilter = 'all';
  let currentTab = 'dashboard';
  let inventoryUnsubscribe = null, choresUnsubscribe = null;

  // ══ Presets ══
  const CHORE_PRESETS = [
    { e:'🧹', n:'掃地拖地' }, { e:'🍽️', n:'洗碗' }, { e:'🧺', n:'洗衣服' },
    { e:'🗑️', n:'倒垃圾' }, { e:'🚿', n:'清潔浴室' }, { e:'🪟', n:'擦窗戶' },
    { e:'🛏️', n:'整理床鋪' }, { e:'🧽', n:'清潔廚房' }
  ];
  function daysFromNow(n) { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; }
  const MOCK_INVENTORY = [
    { id:'m1', order:0, name:'洗碗精', isCountable:false, status:'充足',    expiryDate:'',              colorTag:'#64B5F6', memo:'好市多買的', purchaseDate:'2024-03-01' },
    { id:'m2', order:1, name:'衛生紙', isCountable:true,  quantity:3, alertQty:2, expiryDate:'',          colorTag:'#E0E0E0', memo:'', purchaseDate:'' },
    { id:'m3', order:2, name:'洗衣粉', isCountable:false, status:'快用完了', expiryDate:'',              colorTag:'#BA68C8', memo:'', purchaseDate:'' },
    { id:'m4', order:3, name:'牛奶',   isCountable:true,  quantity:1, alertQty:2, expiryDate:daysFromNow(3), colorTag:'#74C69D', memo:'全聯 $65', purchaseDate:'' },
  ];
  const MOCK_CHORES = [{ id:'c1', title:'🧹 掃地拖地', completed:false, completedBy:'', completedAt:'', date:daysFromNow(0) }];

  // ══ Toast ══
  window.showToast = function(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    if (type === 'success') { t.style.background='#162413'; t.style.color='#74C69D'; t.style.borderColor='rgba(116,198,157,0.3)'; }
    else if (type === 'error') { t.style.background='#2a1212'; t.style.color='#E07070'; t.style.borderColor='rgba(224,112,112,0.3)'; }
    else { t.style.background='#1e1a10'; t.style.color='#F0A849'; t.style.borderColor='rgba(240,168,73,0.3)'; }
    t.className = 'show';
    clearTimeout(t._tid);
    t._tid = setTimeout(() => { t.className = ''; }, 2900);
  };

  // ══ DB status indicator ══
  function setDbStatus(state) {
    const dot  = document.getElementById('db-dot');
    const text = document.getElementById('db-status-text');
    if (!dot) return;
    dot.className = 'db-dot ' + state;
    text.textContent = state === 'online' ? '已連線' : state === 'offline' ? '離線快取' : '未連線';
  }

  // ══ Init ══
  async function initApp() {
    // Hide loading after max 6s regardless
    const loadingTimeout = setTimeout(hideLoading, 6000);

    try {
      if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'YOUR_API_KEY') throw new Error('no key');

      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);

      // Enable offline persistence (IndexedDB cache)
      try {
        await enableIndexedDbPersistence(db);
      } catch (e) {
        // persistence may already be enabled or not supported – ignore
      }

      isFirebaseOk = true;
      setDbStatus('online');
      clearTimeout(loadingTimeout);

      // Start real-time listeners immediately
      startListeners();

    } catch (err) {
      console.warn('Firebase init failed:', err);
      clearTimeout(loadingTimeout);
      document.getElementById('conn-banner').style.display = 'flex';
      setDbStatus('error');
      loadMockData();
    }
  }

  // ══ REAL-TIME LISTENERS (the missing piece!) ══
  function startListeners() {
    // Unsubscribe any existing listeners first
    if (inventoryUnsubscribe) inventoryUnsubscribe();
    if (choresUnsubscribe)    choresUnsubscribe();

    // ── Inventory listener ──
    inventoryUnsubscribe = onSnapshot(
      collection(db, 'inventory'),
      (snap) => {
        inventoryItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderInventory();
        renderShoppingList();
        updateColorFilterBar();
        setDbStatus('online');
        hideLoading(); // hide on first data
      },
      (err) => {
        console.error('inventory snapshot error:', err);
        setDbStatus('offline');
        showToast('⚠️ 資料庫連線中斷，使用快取', 'warn');
      }
    );

    // ── Chores listener ──
    const today = new Date().toISOString().split('T')[0];
    choresUnsubscribe = onSnapshot(
      collection(db, 'chores'),
      (snap) => {
        choresItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderChores();
      },
      (err) => { console.error('chores snapshot error:', err); }
    );

    // Show app & welcome after listeners attach (data will populate via callbacks)
    showAppFrame();
  }

  function hideLoading() {
    const lo = document.getElementById('loading-overlay');
    if (lo) { lo.style.opacity='0'; lo.style.transition='opacity 0.4s'; setTimeout(()=>lo.remove(), 400); }
  }

  function showAppFrame() {
    // Check if user name is stored
    const savedName = localStorage.getItem('hsa_member_name');
    const savedId   = localStorage.getItem('hsa_member_id');
    if (savedName && savedId) {
      currentMemberName = savedName;
      currentMemberId   = savedId;
      document.getElementById('app').style.display = 'block';
      document.getElementById('fab-btn').style.display = 'flex';
      updateMemberChip();
      renderChoreChips();
      updateTodayBadge();
    } else {
      hideLoading();
      document.getElementById('welcome-screen').style.display = 'flex';
    }
  }

  // ══ Welcome ══
  window.submitWelcomeName = function() {
    const name = document.getElementById('welcome-name-input').value.trim();
    if (!name) { showToast('⚠️ 請輸入名字', 'error'); return; }
    currentMemberName = name;
    currentMemberId   = 'u_' + Date.now();
    localStorage.setItem('hsa_member_name', name);
    localStorage.setItem('hsa_member_id',   currentMemberId);
    members = [{ id: currentMemberId, name }];
    document.getElementById('welcome-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('fab-btn').style.display = 'flex';
    updateMemberChip(); renderChoreChips(); updateTodayBadge();
    showToast(`👋 歡迎，${name}！`);
  };

  // ══ Mock (offline fallback) ══
  function loadMockData() {
    inventoryItems = MOCK_INVENTORY.map(i => ({ ...i }));
    choresItems    = MOCK_CHORES.map(c => ({ ...c }));
    members = [{ id:'demo', name:'示範用戶' }];
    currentMemberId = 'demo'; currentMemberName = '示範用戶';
    showAppFrame();
    renderInventory(); renderShoppingList(); renderChores(); updateColorFilterBar();
  }

  // ══ Tab switching ══
  window.switchTab = function(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    document.getElementById('nav-'+tab).classList.add('active');
    if (tab === 'chores') renderChores();
  };

  window.handleFab = function() {
    if (currentTab === 'chores') { renderChoreChips(); openModal('modal-add-chore'); }
    else openItemModal();
  };

  // ══ Save Item (Add / Edit) ══
  window.saveItem = async function() {
    const btn    = document.getElementById('save-item-btn');
    const editId = document.getElementById('edit-item-id').value;
    const name   = document.getElementById('item-name').value.trim();
    if (!name) { showToast('⚠️ 請輸入物品名稱', 'error'); document.getElementById('item-name').focus(); return; }

    const qty      = parseInt(document.getElementById('item-qty').value) || 0;
    const alertQty = parseInt(document.getElementById('item-alert-qty').value) || 1;
    const exp      = document.getElementById('item-expiry').value;
    const pur      = document.getElementById('item-purchase').value;
    const memo     = document.getElementById('item-memo').value.trim();
    const colorTag = document.querySelector('.color-option.selected')?.dataset.color || '#E0E0E0';
    const isCountable = document.getElementById('type-countable').classList.contains('selected');

    let status = '充足';
    if (!isCountable) {
      const sel = document.querySelector('#status-field .toggle-btn.selected');
      status = sel ? sel.dataset.status : '充足';
    }

    const data = {
      name, isCountable,
      status:       isCountable ? '' : status,
      quantity:     isCountable ? qty : 0,
      alertQty:     isCountable ? alertQty : 1,
      expiryDate:   exp || '',
      purchaseDate: pur || '',
      memo, colorTag,
      updatedAt: new Date().toISOString()
    };

    // Disable button to prevent double-tap
    btn.disabled = true; btn.textContent = '儲存中…';

    try {
      if (editId) {
        // ── EDIT ──
        if (isFirebaseOk) {
          await updateDoc(doc(db, 'inventory', editId), data);
          // onSnapshot will update UI automatically
        } else {
          const idx = inventoryItems.findIndex(i => i.id === editId);
          if (idx > -1) Object.assign(inventoryItems[idx], data);
          renderInventory(); renderShoppingList();
        }
        showToast('✅ 物品已更新！');
      } else {
        // ── ADD ──
        const maxOrder = inventoryItems.length > 0 ? Math.max(...inventoryItems.map(i => i.order ?? 0)) : -1;
        data.order = maxOrder + 1;
        if (isFirebaseOk) {
          await addDoc(collection(db, 'inventory'), data);
          // onSnapshot will update UI
        } else {
          inventoryItems.push({ id:'local_'+Date.now(), ...data });
          renderInventory(); renderShoppingList(); updateColorFilterBar();
        }
        showToast('✅ 已新增物品！');
      }
      closeModal('modal-add-item');
    } catch (err) {
      console.error('saveItem error:', err);
      showToast('❌ 儲存失敗：' + err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '💾 儲存物品';
    }
  };

  // ══ Order (move up/down one step) ══
  window.moveItemOrder = async function(id, direction) {
    // Normalise orders to consecutive integers
    const sorted = [...inventoryItems].sort((a,b) => (a.order??0) - (b.order??0));
    sorted.forEach((item, i) => { item.order = i; });

    const idx = sorted.findIndex(i => i.id === id);
    if (idx === -1) return;
    const targetIdx = idx + direction;
    if (targetIdx < 0 || targetIdx >= sorted.length) return;

    // Swap
    const tmp = sorted[idx].order;
    sorted[idx].order    = sorted[targetIdx].order;
    sorted[targetIdx].order = tmp;

    // Update local state & re-render immediately
    inventoryItems = [...sorted].sort((a,b) => a.order - b.order);
    renderInventory();

    // Persist to Firebase in background
    if (isFirebaseOk) {
      try {
        await Promise.all([
          updateDoc(doc(db, 'inventory', sorted[idx].id),    { order: sorted[idx].order }),
          updateDoc(doc(db, 'inventory', sorted[targetIdx].id), { order: sorted[targetIdx].order })
        ]);
      } catch (e) { console.warn('order update failed', e); }
    }
  };

  // ══ Qty ══
  window.decreaseQty = async function(id, curQty) {
    if (curQty <= 0) return;
    const newQty = curQty - 1;
    if (isFirebaseOk) await updateDoc(doc(db,'inventory',id), { quantity: newQty });
    else { const item = inventoryItems.find(i=>i.id===id); if(item) item.quantity=newQty; renderInventory(); renderShoppingList(); }
  };
  window.increaseQty = async function(id, curQty) {
    const newQty = curQty + 1;
    if (isFirebaseOk) await updateDoc(doc(db,'inventory',id), { quantity: newQty });
    else { const item = inventoryItems.find(i=>i.id===id); if(item) item.quantity=newQty; renderInventory(); renderShoppingList(); }
  };
  window.cycleStatus = async function(id, currentStatus) {
    const sf = { '充足':'夠用','夠用':'快用完了','快用完了':'充足' };
    const newStatus = sf[currentStatus] || '充足';
    if (isFirebaseOk) await updateDoc(doc(db,'inventory',id), { status: newStatus });
    else { const item = inventoryItems.find(i=>i.id===id); if(item) item.status=newStatus; renderInventory(); renderShoppingList(); }
  };
  window.deleteItem = async function(id) {
    if (!confirm('確定要刪除這個物品嗎？')) return;
    if (isFirebaseOk) await deleteDoc(doc(db,'inventory',id));
    else { inventoryItems = inventoryItems.filter(i=>i.id!==id); renderInventory(); renderShoppingList(); updateColorFilterBar(); }
    showToast('🗑️ 已刪除物品');
  };

  // ══ Color filter ══
  window.setColorFilter = function(color, btn) {
    activeColorFilter = color;
    document.querySelectorAll('.cf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderInventory();
  };
  function updateColorFilterBar() {
    const bar = document.getElementById('color-filter-bar');
    const usedColors = [...new Set(inventoryItems.map(i=>i.colorTag).filter(Boolean))];
    let html = `<button class="cf-btn ${activeColorFilter==='all'?'active':''}" data-color="all" onclick="setColorFilter('all',this)">
      <span style="font-size:0.8rem;">⬜</span> 全部 (${inventoryItems.length})
    </button>`;
    usedColors.forEach(c => {
      const items = inventoryItems.filter(i=>i.colorTag===c);
      const label = items.length<=2 ? items.map(i=>i.name).join('、') : items[0].name+'等';
      html += `<button class="cf-btn ${activeColorFilter===c?'active':''}" data-color="${c}" onclick="setColorFilter('${c}',this)">
        <span class="cf-dot" style="background:${c};"></span>${label} (${items.length})
      </button>`;
    });
    bar.innerHTML = html;
  }

  // ══ Render Inventory ══
  function renderInventory() {
    const el = document.getElementById('inventory-list');
    if (!inventoryItems.length) {
      el.innerHTML = `<div class="empty"><i class="fa fa-box-open"></i>庫存空空如也<br/><small style="display:block;margin-top:4px;">點右下角 ＋ 新增第一件物品</small></div>`;
      return;
    }

    const sorted   = [...inventoryItems].sort((a,b) => (a.order??0) - (b.order??0));
    const filtered = activeColorFilter === 'all' ? sorted : sorted.filter(i => i.colorTag === activeColorFilter);

    if (!filtered.length) {
      el.innerHTML = `<div class="empty"><i class="fa fa-filter"></i>此顏色分類下沒有物品</div>`;
      return;
    }

    el.innerHTML = filtered.map((item, index) => {
      // Expiry
      let expText = '';
      if (item.expiryDate) {
        const diff = Math.floor((new Date(item.expiryDate) - new Date().setHours(0,0,0,0)) / 86400000);
        expText = diff < 0
          ? `<span style="color:var(--red);font-weight:800;">⚠️ 已過期 ${Math.abs(diff)} 天</span>`
          : diff <= 7
          ? `<span style="color:var(--yellow);font-weight:800;">🟡 ${diff} 天後到期</span>`
          : `<span>📅 效期 ${item.expiryDate}</span>`;
      }
      const purText  = item.purchaseDate ? `<span>🛒 ${item.purchaseDate}</span>` : '';
      const memoHtml = item.memo ? `<div class="inv-memo"><i class="fa fa-thumbtack" style="font-size:0.68rem;"></i>${item.memo}</div>` : '';
      const colorDot = item.colorTag ? `<span class="color-dot" style="background:${item.colorTag};"></span>` : '';

      const needsAlert = item.isCountable && (item.quantity??0) <= (item.alertQty??1);
      const alertBadge = needsAlert ? `<span class="alert-badge"><i class="fa fa-bell" style="font-size:0.6rem;"></i>待購</span>` : '';

      const control = item.isCountable
        ? `<div class="qty-box">
            <button class="qty-btn minus" onclick="decreaseQty('${item.id}',${item.quantity??0})">−</button>
            <div class="qty-val">${item.quantity??0}</div>
            <button class="qty-btn plus"  onclick="increaseQty('${item.id}',${item.quantity??0})">＋</button>
           </div>`
        : `<button class="status-btn ${item.status==='充足'?'ok':item.status==='夠用'?'warn':'bad'}" onclick="cycleStatus('${item.id}','${item.status}')">
            ${item.status==='充足'?'✅ 充足':item.status==='夠用'?'🟡 夠用':'🔴 快用完了'}
           </button>`;

      return `
        <div class="card" id="card-${item.id}">
          <div class="inv-row">
            <div class="sort-controls">
              <button class="sort-btn" ${index===0?'disabled':''} onclick="moveItemOrder('${item.id}',-1)" title="上移一格">
                <i class="fa fa-chevron-up"></i>
              </button>
              <button class="sort-btn" ${index===filtered.length-1?'disabled':''} onclick="moveItemOrder('${item.id}',1)" title="下移一格">
                <i class="fa fa-chevron-down"></i>
              </button>
            </div>
            <div class="inv-info">
              <div class="inv-name">${colorDot}${item.name}${alertBadge}</div>
              <div class="inv-meta">${expText}${purText}</div>
              ${memoHtml}
            </div>
            ${control}
            <div class="action-btn-group">
              <button class="icon-btn edit-btn" onclick="openItemModal('${item.id}')" title="編輯"><i class="fa fa-pen"></i></button>
              <button class="icon-btn del-btn"  onclick="deleteItem('${item.id}')"   title="刪除"><i class="fa fa-trash"></i></button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ══ Render Shopping ══
  function renderShoppingList() {
    const el = document.getElementById('shopping-list');
    const needed = inventoryItems.filter(i =>
      i.isCountable ? (i.quantity??0) <= (i.alertQty??1) : i.status === '快用完了'
    );
    if (!needed.length) {
      el.innerHTML = `<div class="card" style="text-align:center;padding:11px;color:var(--green);font-size:0.86rem;font-weight:800;">
        <i class="fa fa-check-circle"></i> 太棒了！目前不需補貨
      </div>`; return;
    }
    el.innerHTML = `<div class="card" style="padding:8px 14px;">
      ${needed.map(i=>`
        <div class="shop-row">
          <div class="shop-dot" style="background:${i.colorTag||'var(--primary)'}"></div>
          <span style="font-weight:800;flex:1;font-size:0.9rem;">${i.name}</span>
          <span style="font-size:0.74rem;color:var(--red);font-weight:800;">
            ${i.isCountable ? `剩 ${i.quantity??0}（需 >${i.alertQty??1}）` : i.status}
          </span>
        </div>`).join('')}
    </div>`;
  }

  // ══ Render Chores ══
  function renderChores() {
    const el    = document.getElementById('chores-list');
    const logEl = document.getElementById('recent-log');
    if (!el) return;
    const today = new Date().toISOString().split('T')[0];
    const todayC = choresItems.filter(c => c.date === today);

    if (!todayC.length) {
      el.innerHTML = `<div class="empty"><i class="fa fa-broom"></i>今日還沒有家務<br/><small style="display:block;margin-top:4px;">點右下角 ＋ 新增</small></div>`;
    } else {
      el.innerHTML = todayC.map(c=>`
        <div class="card">
          <div class="chore-row">
            <div class="chore-check ${c.completed?'done':''}" onclick="toggleChore('${c.id}')">
              ${c.completed?'<i class="fa fa-check"></i>':''}
            </div>
            <div style="flex:1;">
              <div class="chore-title ${c.completed?'done':''}">${c.title}</div>
              ${c.completedBy?`<div class="chore-sub">✅ ${c.completedBy}${c.completedAt?' · '+c.completedAt:''}</div>`:''}
            </div>
            <button class="icon-btn del-btn" onclick="deleteChore('${c.id}')"><i class="fa fa-trash"></i></button>
          </div>
        </div>`).join('');
    }

    const done = todayC.filter(c=>c.completed);
    logEl.innerHTML = done.length
      ? `<div class="card" style="padding:8px 14px;">${done.map(c=>`
          <div class="shop-row">
            <div class="shop-dot" style="background:var(--green)"></div>
            <span style="flex:1;font-weight:800;font-size:0.88rem;">${c.title}</span>
            <span style="font-size:0.74rem;color:var(--green);font-weight:800;">${c.completedBy||''}</span>
          </div>`).join('')}</div>`
      : `<div style="color:var(--text-dim);font-size:0.83rem;padding:8px 0;">尚無完成紀錄</div>`;
  }

  window.toggleChore = async function(id) {
    const chore = choresItems.find(c=>c.id===id);
    if (!chore) return;
    chore.completed   = !chore.completed;
    chore.completedBy = chore.completed ? currentMemberName : '';
    chore.completedAt = chore.completed ? new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) : '';
    if (isFirebaseOk) await updateDoc(doc(db,'chores',id), { completed:chore.completed, completedBy:chore.completedBy, completedAt:chore.completedAt });
    renderChores();
    showToast(chore.completed ? '✅ 家務完成！' : '↩️ 已取消完成');
  };
  window.deleteChore = async function(id) {
    if (!confirm('確定刪除此家務？')) return;
    if (isFirebaseOk) await deleteDoc(doc(db,'chores',id));
    else choresItems = choresItems.filter(c=>c.id!==id);
    renderChores();
  };

  function renderChoreChips() {
    document.getElementById('chore-chips').innerHTML = CHORE_PRESETS.map(c=>
      `<div class="chore-chip" data-name="${c.e} ${c.n}" onclick="toggleChip(this)">${c.e} ${c.n}</div>`
    ).join('');
  }
  window.saveChore = async function() {
    const selected = [...document.querySelectorAll('.chore-chip.selected')].map(c=>c.dataset.name);
    const custom   = document.getElementById('custom-chore').value.trim();
    const toAdd    = [...selected, ...(custom?[custom]:[])];
    if (!toAdd.length) { showToast('⚠️ 請選擇或輸入家務','error'); return; }
    const today = new Date().toISOString().split('T')[0];
    for (const title of toAdd) {
      const nc = { title, completed:false, completedBy:'', completedAt:'', date:today };
      if (isFirebaseOk) await addDoc(collection(db,'chores'), nc);
      else choresItems.push({ id:'c_'+Date.now()+'_'+Math.random(), ...nc });
    }
    if (!isFirebaseOk) renderChores();
    closeModal('modal-add-chore');
    document.getElementById('custom-chore').value = '';
    document.querySelectorAll('.chore-chip').forEach(c=>c.classList.remove('selected'));
    showToast(`✅ 已新增 ${toAdd.length} 個家務`);
  };

  // ══ UI helpers ══
  window.openItemModal = function(editId=null) {
    document.getElementById('edit-item-id').value = editId || '';
    if (editId) {
      document.getElementById('item-modal-title').innerHTML = '✏️ 編輯庫存物品';
      const item = inventoryItems.find(i=>i.id===editId);
      if (item) {
        document.getElementById('item-name').value      = item.name;
        document.getElementById('item-qty').value       = item.quantity??1;
        document.getElementById('item-alert-qty').value = item.alertQty??1;
        document.getElementById('item-expiry').value    = item.expiryDate||'';
        document.getElementById('item-purchase').value  = item.purchaseDate||'';
        document.getElementById('item-memo').value      = item.memo||'';
        selectType(item.isCountable ? 'countable' : 'uncountable');
        document.querySelectorAll('.color-option').forEach(c=>c.classList.remove('selected'));
        const matched = document.querySelector(`.color-option[data-color="${item.colorTag}"]`);
        if (matched) matched.classList.add('selected');
        else document.querySelector('.color-option').classList.add('selected');
        if (!item.isCountable) {
          document.querySelectorAll('#status-field [data-status]').forEach(b =>
            b.classList.toggle('selected', b.dataset.status===item.status)
          );
        }
      }
    } else {
      document.getElementById('item-modal-title').innerHTML = '➕ 新增庫存物品';
      resetItemForm();
    }
    openModal('modal-add-item');
    // Focus name field after animation
    setTimeout(() => document.getElementById('item-name').focus(), 350);
  };

  window.openModal  = id => document.getElementById(id).classList.add('open');
  window.closeModal = id => document.getElementById(id).classList.remove('open');

  window.selectType = function(type) {
    document.getElementById('type-countable').classList.toggle('selected',   type==='countable');
    document.getElementById('type-uncountable').classList.toggle('selected', type==='uncountable');
    document.getElementById('qty-field').style.display    = type==='countable'   ? 'block' : 'none';
    document.getElementById('status-field').style.display = type==='uncountable' ? 'block' : 'none';
  };
  window.selectStatus = function(btn) {
    document.querySelectorAll('#status-field [data-status]').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  };
  window.selectColor = function(btn) {
    document.querySelectorAll('.color-option').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  };
  window.toggleChip = el => el.classList.toggle('selected');

  // Close modal on backdrop click
  document.querySelectorAll('.modal-overlay').forEach(ov =>
    ov.addEventListener('click', e => { if (e.target===ov) ov.classList.remove('open'); })
  );

  function resetItemForm() {
    document.getElementById('item-name').value      = '';
    document.getElementById('item-qty').value       = '1';
    document.getElementById('item-alert-qty').value = '1';
    document.getElementById('item-expiry').value    = '';
    document.getElementById('item-purchase').value  = '';
    document.getElementById('item-memo').value      = '';
    selectType('countable');
    document.querySelectorAll('.color-option').forEach((b,i) => b.classList.toggle('selected', i===0));
    document.querySelectorAll('#status-field [data-status]').forEach((b,i) => b.classList.toggle('selected', i===0));
  }

  function updateMemberChip() {
    document.getElementById('current-member-name').textContent = currentMemberName;
    document.getElementById('member-avatar').textContent       = currentMemberName[0]||'?';
  }
  function updateTodayBadge() {
    document.getElementById('today-badge').textContent =
      `📅 ${new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}`;
  }

  // ══ Member management ══
  window.openMemberModal = function() {
    const ul = document.getElementById('members-list-ui');
    ul.innerHTML = members.length
      ? members.map(m=>`
          <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);">
            <div class="m-avatar">${m.name[0]}</div>
            <span style="font-weight:800;flex:1;">${m.name}</span>
            <button onclick="switchMember('${m.id}','${m.name}')" style="padding:5px 12px;background:${currentMemberId===m.id?'var(--primary-light)':'var(--bg2)'};border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Nunito',sans-serif;font-size:0.79rem;font-weight:800;cursor:pointer;">
              ${currentMemberId===m.id?'✅ 使用中':'切換'}
            </button>
          </div>`).join('')
      : '<div style="color:var(--text-dim);padding:8px 0;font-size:0.85rem;">暫無成員</div>';
    openModal('modal-member');
  };
  window.switchMember = function(id, name) {
    currentMemberId = id; currentMemberName = name;
    localStorage.setItem('hsa_member_name', name);
    localStorage.setItem('hsa_member_id',   id);
    updateMemberChip(); closeModal('modal-member');
    showToast(`👤 切換到 ${name}`);
  };
  window.addMember = function() {
    const input = document.getElementById('new-member-input');
    const name  = input.value.trim();
    if (!name) { showToast('⚠️ 請輸入名字','error'); return; }
    if (members.find(m=>m.name===name)) { showToast('⚠️ 此名字已存在','error'); return; }
    members.push({ id:'u_'+Date.now(), name });
    input.value = '';
    openMemberModal();
    showToast(`✅ 已新增成員 ${name}`);
  };

  // ══ Boot ══
  initApp();
</script>
</body>
</html>
